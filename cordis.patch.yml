# dsh-llm-grok bundle layer.
# Installed via `dsh plugin --profile <name> add ./dsh-llm-grok`.
#
# Compatible with DSH 0.2.0-rc.2 and 0.2.1-rc.2 (`@deepseek-ai/dsh-llm`
# prepareCall / attributionHeaders / settings namespace `llm-grok`; the 0.2.1
# line only adds the `imageRequestTarget` adapter hook, which this route keeps
# its inherited default for).
# The `@deepseek-ai/dsh*` peerDependencies range must cover the running dsh
# version: the loader refuses to mount a bundle whose peers do not satisfy it
# with prereleases included, which silently leaves the `grok` provider
# unregistered ("no adapter registered for provider \"grok\""). npm and pnpm
# evaluate the same ranges strictly, where `^0.2.0-rc.2` never covers a 0.2.1
# pre-release, so each line is named explicitly.
# The plugin registers provider route `grok` on DSH's LLM seam.
# If you previously added a `grok` provider through `llm-pi-ai` settings,
# remove that pi-ai provider first to avoid a duplicate route.
- insert:
    - id: llm-grok
      name: dsh-llm-grok
      config:
        # Direct Grok subscription endpoint through Clash/7890 proxy.
        # No local Python proxy is required.
        baseURL: https://cli-chat-proxy.grok.com/v1
        apiKeyEnv: GROK_SESSION_TOKEN
        proxy: http://127.0.0.1:7890
        models:
          - id: grok-4.7
            name: Grok 4.7
            contextWindow: 500000
            maxTokens: 128000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: grok-4.7-build-fast
            name: Grok 4.7 Fast
            contextWindow: 500000
            maxTokens: 128000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: grok-4.6
            name: Grok 4.6
            contextWindow: 500000
            maxTokens: 128000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: grok-4.5
            name: Grok 4.5
            contextWindow: 500000
            maxTokens: 128000
            reasoningEfforts:
              low: low
              medium: medium
              high: high
